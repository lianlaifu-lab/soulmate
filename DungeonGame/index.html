<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#263932">
<title>微光地牢</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main id="playScreen" class="stage" aria-label="微光地牢">
  <div class="arena">
    <canvas id="game" tabindex="0" aria-label="游戏画面"></canvas>
    <div class="touch-controls">
      <div id="movePad" class="pad" aria-label="移动摇杆"><i class="knob"></i></div>
      <div id="aimPad" class="pad" aria-label="瞄准与射击摇杆"><i class="knob"></i></div>
    </div>
  </div>
  <div class="hud"><span id="stats">♥ 100 · 60s</span></div>
  <button id="pause" aria-label="打开暂停菜单" title="暂停">暂停</button>
  <div id="overlay" class="overlay" hidden>
    <section class="menu" aria-label="游戏菜单">
      <strong id="overlayTitle">微光地牢</strong>
      <span id="overlayText">准备开始</span>
      <span class="rotate-tip">请横置手机游玩</span>
      <button id="resume">开始游戏</button>
      <button id="reset" hidden>重新开始</button>
      <button id="fullscreen" hidden>进入全屏</button>
      <span id="screenHint" aria-live="polite"></span>
    </section>
  </div>
</main>
<script type="module" src="./js/immersive.js"></script>
</body>
</html>
