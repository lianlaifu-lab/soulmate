<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#263932">
<title>微光地牢 · v0.5.1</title>
<link rel="stylesheet" href="./css/style.css?v=0.5.1">
</head>
<body>
<main id="playScreen" class="stage" aria-label="微光地牢">
  <div class="arena">
    <canvas id="game" tabindex="0" aria-label="游戏画面"></canvas>
    <div class="touch-controls">
      <div id="movePad" class="pad" aria-label="移动摇杆"><i class="knob"></i></div>
      <div id="aimPad" class="pad" aria-label="瞄准与射击摇杆"><i class="knob"></i></div>
    </div>
  </div>
  <div class="hud"><span id="stats">60s</span></div>
  <div id="healthPanel" class="health-panel" role="progressbar" aria-label="生命值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
    <span class="heart" aria-hidden="true">♥</span><div class="health-track"><div id="healthFill" class="health-fill"></div></div><span id="healthValue">100/100</span>
  </div>
  <div class="coin-panel" aria-label="金币"><span class="coin-icon" aria-hidden="true">Ⅰ</span><span id="coinCount">0</span></div>
  <button id="switchWeapon" class="weapon-switch" aria-label="切换武器"><span id="weaponIcon"></span><span id="weaponName">手枪</span><small id="weaponCount">1/1 ↻</small></button>
  <div id="weaponNotice" class="weapon-notice" aria-live="polite"></div>
  <button id="pause" aria-label="打开暂停菜单" title="暂停">暂停</button>
  <div id="overlay" class="overlay">
    <section class="menu" aria-label="游戏菜单">
      <small id="buildVersion" class="build-version">v0.5.1 · 正在加载</small>
      <strong id="overlayTitle">微光地牢</strong>
      <span id="overlayText">正在加载游戏…</span>
      <span class="rotate-tip">请横置手机游玩</span>
      <button id="resume" disabled>开始游戏</button>
      <button id="reset" hidden>重新开始</button>
      <button id="fullscreen" hidden>进入全屏</button>
      <span id="screenHint" aria-live="polite"></span>
    </section>
  </div>
</main>
<script type="module">
const build = document.getElementById('buildVersion');
import('./js/immersive.js?v=0.5.1').then(() => {
  build.textContent = 'v0.5.1 · 已加载';
  document.getElementById('resume').disabled = false;
}).catch(error => {
  console.error('游戏加载失败', error);
  build.textContent = 'v0.5.1 · 加载失败';
  document.getElementById('overlay').hidden = false;
  document.getElementById('overlayTitle').textContent = '游戏文件未完整加载';
  document.getElementById('overlayText').textContent = '请通过 HTTP 地址打开，并完整替换 index.html、css 和 js 文件夹后刷新。';
  document.getElementById('resume').disabled = true;
});
</script>
</body>
</html>
